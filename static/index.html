<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药物警戒案例台</title>
<style>
body{font:15px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}
section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}
input,textarea,button{font:inherit;padding:8px;margin:4px}input{width:220px}
button{background:#174ea6;color:white;border:0;border-radius:6px;cursor:pointer}.secondary{background:#4b5563}
pre{background:#111827;color:#d1fae5;padding:14px;overflow:auto}.cards{display:grid;gap:10px}
.card{border:1px solid #d8dee9;border-radius:8px;padding:12px}.pending{border-left:5px solid #d97706}.done{border-left:5px solid #059669}
.reason{color:#b45309;font-weight:600}.muted{color:#6b7280}
</style>
<h1>药物警戒案例台</h1><p>标准库 JSON API 概览。请求需带 X-User-Id、X-Role；区域角色还需 X-Region。</p>
<section>
  <h2>快速查看</h2>
  <input id="user" value="global-admin"><input id="role" value="global_admin"><input id="region" placeholder="X-Region">
  <button onclick="loadState()">刷新案例</button><pre id="out"></pre>
</section>
<section>
  <h2>患者匿名化 / 隐私处置单</h2>
  <p class="muted">相同患者重复申请会取回首次处置单；有未提交报告时申请停留“待处理”。</p>
  <input id="privacyPatient" placeholder="患者标识，如 P-1">
  <button onclick="createPrivacy()">提交/重提申请</button>
  <button class="secondary" onclick="loadPrivacyList()">刷新处置单</button>
  <div id="privacyList" class="cards"></div><pre id="privacyOut"></pre>
</section>
<script>
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function headers(){return {'X-User-Id':user.value,'X-Role':role.value,'X-Region':region.value}}
async function read(r){let j=await r.json();if(!r.ok)throw new Error(j.message||j.error);return j}
async function loadState(){try{let j=await read(await fetch('/api/state',{headers:headers()}));out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent=e.message}}
async function createPrivacy(){
  let r=await fetch('/api/privacy-requests',{method:'POST',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({patient_ref:privacyPatient.value.trim()})});
  try{let j=await read(r);privacyOut.textContent=JSON.stringify(j,null,2);loadPrivacyList()}catch(e){privacyOut.textContent=e.message}
}
async function showPrivacy(id){try{let j=await read(await fetch('/api/privacy-requests/'+id,{headers:headers()}));privacyOut.textContent=JSON.stringify(j,null,2)}catch(e){privacyOut.textContent=e.message}}
async function executePrivacy(id){
  try{let j=await read(await fetch('/api/privacy-requests/'+id+'/execute',{method:'POST',headers:headers()}));privacyOut.textContent=JSON.stringify(j,null,2);loadPrivacyList()}catch(e){privacyOut.textContent=e.message}
}
async function loadPrivacyList(){
  try{let j=await read(await fetch('/api/privacy-requests',{headers:headers()}));privacyList.innerHTML=j.requests.map(q=>{
    let requestId=Number(q.id);
    let status=q.status==='pending'?'待处理':'已脱敏';
    let reason=q.blocking_reasons&&q.blocking_reasons.length?`<div class="reason">阻塞原因：${esc(q.blocking_reasons.join('；'))}</div>`:'<div class="muted">无阻塞</div>';
    let action=q.status==='pending'?`<button onclick="executePrivacy(${requestId})">执行脱敏</button>`:'';
    return `<div class="card ${q.status==='pending'?'pending':'done'}"><b>#${requestId} ${esc(q.request_no)}</b> · ${status}<div class="muted">代号：${esc(q.pseudonym||'（待生成）')}</div>${reason}<button class="secondary" onclick="showPrivacy(${requestId})">查看详情</button>${action}</div>`
  }).join('')||'<p class="muted">暂无处置单</p>'}catch(e){privacyList.textContent=e.message}
}
loadState();loadPrivacyList();
</script>
